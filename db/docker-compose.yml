# SQL Server para desarrollo (opción B). En Windows también sirve LocalDB (opción A, ver README).
# ⚠️ Contraseña SOLO de desarrollo. Cámbiala si expones el puerto fuera de tu equipo.
services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: corteza-sqlserver
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: "Developer"
      MSSQL_SA_PASSWORD: "Corteza_Dev2026!"
      MSSQL_COLLATION: "Modern_Spanish_CI_AI"
    ports:
      - "1433:1433"
    volumes:
      - corteza_sqldata:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$${MSSQL_SA_PASSWORD}\" -C -Q \"SELECT 1\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

volumes:
  corteza_sqldata:
