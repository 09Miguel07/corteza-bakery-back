name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore Corteza.slnx
      - run: dotnet build Corteza.slnx --no-restore -c Release
      - name: Test (domain coverage gate 80 %)
        run: dotnet test Corteza.slnx --no-build -c Release --logger "trx" --collect:"XPlat Code Coverage" --results-directory TestResults
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: TestResults
