apiVersion: apps/v1
kind: Deployment
metadata:
  name: corteza-api
  namespace: corteza
spec:
  replicas: 2
  selector:
    matchLabels: { app: corteza-api }
  template:
    metadata:
      labels: { app: corteza-api }
    spec:
      containers:
        - name: api
          image: ghcr.io/09miguel07/corteza-api:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
          env:
            - name: SA_PASSWORD
              valueFrom: { secretKeyRef: { name: corteza-secrets, key: SA_PASSWORD } }
            - name: ConnectionStrings__Corteza
              value: "Server=sqlserver,1433;Database=Corteza;User Id=sa;Password=$(SA_PASSWORD);TrustServerCertificate=True"
            - name: Jwt__Key
              valueFrom: { secretKeyRef: { name: corteza-secrets, key: JWT_KEY } }
            - name: Seed__DefaultPassword
              valueFrom: { secretKeyRef: { name: corteza-secrets, key: SEED_PASSWORD } }
            # Migra y carga los datos demo la primera vez (el seed no hace nada si ya hay usuarios).
            - { name: Database__InitialiseOnStartup, value: "true" }
          readinessProbe:
            httpGet: { path: /health, port: 8080 }
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /health, port: 8080 }
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            requests: { cpu: 100m, memory: 192Mi }
            limits: { memory: 512Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: corteza-api
  namespace: corteza
spec:
  selector: { app: corteza-api }
  ports:
    - { port: 8080, targetPort: 8080 }
