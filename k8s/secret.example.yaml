# Plantilla: copia a secret.yaml (está en .gitignore), cambia los valores y aplícalo.
#   kubectl apply -f k8s/secret.yaml
# O créalo directo sin archivo:
#   kubectl -n corteza create secret generic corteza-secrets \
#     --from-literal=SA_PASSWORD='<clave SQL fuerte>' \
#     --from-literal=JWT_KEY='<mínimo 32 caracteres>' \
#     --from-literal=SEED_PASSWORD='<clave de los usuarios demo>'
apiVersion: v1
kind: Secret
metadata:
  name: corteza-secrets
  namespace: corteza
type: Opaque
stringData:
  SA_PASSWORD: "CAMBIAR-clave-SQL-fuerte-1!"
  JWT_KEY: "CAMBIAR-llave-jwt-de-al-menos-32-caracteres"
  SEED_PASSWORD: "CAMBIAR-clave-usuarios-demo"
